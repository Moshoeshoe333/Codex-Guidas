name: Lesson allocator regression

on:
  pull_request:
    paths:
      - "scripts/new_record.py"
      - "tests/test_lesson_allocator.py"
      - ".github/workflows/lesson-allocator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  allocator:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run lesson allocator regression tests
        run: python -m unittest discover -s tests -p "test_lesson_allocator.py" -v
