name: Knowledge integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate records and links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run CLI regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate metadata, IDs, index and local links
        run: python scripts/codex.py validate
      - name: Validate assurance universe and invariant operation registers
        run: python scripts/assurance_register.py validate
      - name: Smoke-test assurance review queue
        shell: bash
        run: |
          python scripts/assurance_register.py queue --as-of 2026-11-20 | tee assurance-queue.out
          grep -q "CG-IC-001" assurance-queue.out
      - name: Build and inspect machine-readable knowledge index
        run: |
          python scripts/build_index.py --output /tmp/knowledge-index.json
          python -c "import json; d=json.load(open('/tmp/knowledge-index.json', encoding='utf-8')); assert any(r['id']=='DEF-2026-002' and 'persistence' in r['tags'] for r in d['records'])"
      - name: Smoke-test curated tag retrieval
        shell: bash
        run: |
          python scripts/codex.py search "non-atomic" --tag persistence | tee tag-search.out
          grep -q "DEF-2026-002" tag-search.out
      - name: Smoke-test lesson and defect retrieval
        shell: bash
        run: |
          python scripts/codex.py search "hydration" --project SOULSYNCMOBILE | tee search.out
          grep -q "DEF-2026-001" search.out
      - name: Smoke-test verification review queue
        shell: bash
        run: |
          python scripts/codex.py review-queue --as-of 2026-11-19 | tee review-queue.out
          grep -q "DEF-2026-001" review-queue.out
